name: NxtHire Features Suite (Allure Report)

on:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Optional: only run tests matching this pattern (leave blank for full suite)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'tests/**.spec.js'
      - '.github/workflows/features-playwright.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chrome only)
        run: npx playwright install --with-deps chromium

      - name: Run full 15-feature test suite
        env:
          NXTHIRE_EMAIL: ${{ secrets.NXTHIRE_EMAIL }}
          NXTHIRE_PASSWORD: ${{ secrets.NXTHIRE_PASSWORD }}
        run: npx playwright test ${{ github.event.inputs.test_pattern && format('-g "{0}"', github.event.inputs.test_pattern) || '' }}
        continue-on-error: true

      - name: Re-run only failed tests
        env:
          NXTHIRE_EMAIL: ${{ secrets.NXTHIRE_EMAIL }}
          NXTHIRE_PASSWORD: ${{ secrets.NXTHIRE_PASSWORD }}
        run: npx playwright test --last-failed
        continue-on-error: true

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline --save-dev
          allure generate allure-results --clean -o allure-report-features

      - name: Prepare docs/features folder for Pages
        run: |
          mkdir -p docs/features
          rm -rf docs/features/*
          cp -r allure-report-features/* docs/features/

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/features
          git diff --staged --quiet || git commit -m "Update Features suite Allure report [skip ci]"
          git push